const pickColor=(name)=>{const c=['#0e8c7d','#4f46e5','#dd7a16','#d83a3a','#0891b2','#7c3aed','#1f9d57'];let h=0;const s=name||'?';for(let i=0;i<s.length;i++)h=(h+s.charCodeAt(i))%c.length;return c[h];};
const barColorFor=(p)=> p>=100?'#22b573':p>=40?primary:p>0?'#f5b301':'#cbd5e1';
const statsFor=(arr)=>{const total=arr.length,done=arr.filter(j=>j.progress>=100).length,over=arr.filter(j=>j.daysType==='over').length,avg=total?Math.round(arr.reduce((s,j)=>s+j.progress,0)/total):0;return {total,done,over,pending:total-done,avg,avgStyle:avg+'%'};};

function ChipScroller({statuses,base}){
  const hex2rgba=(h,a)=>{const n=h.replace('#','');const r=parseInt(n.substring(0,2),16),g=parseInt(n.substring(2,4),16),b=parseInt(n.substring(4,6),16);return 'rgba('+r+','+g+','+b+','+a+')';};
  return (
    <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:9,paddingLeft:53}}>
      {statuses.map((st,j)=>{
        const flash=st.flash&&st.count>0;
        return (
        <a key={j} className="fn-status-row" href={base+'&status='+st.key} style={{display:'inline-flex',alignItems:'center',gap:6,padding:'3px 9px 3px 4px',borderRadius:10,textDecoration:'none',color:'#5a6473',border:'1px solid '+(flash?hex2rgba(st.color,.35):'#eef0f4'),background:flash?hex2rgba(st.color,.06):'#fff',transition:'background .15s,border-color .15s'}}>
          <span className={flash?'stat-flash':''} style={{minWidth:19,height:19,borderRadius:6,background:st.color,color:'#fff',fontSize:11,fontWeight:700,display:'inline-flex',alignItems:'center',justifyContent:'center',padding:'0 4px'}}>{st.count}</span>
          <span style={{fontSize:11.5,fontWeight:500,whiteSpace:'nowrap'}}>{st.label}</span>
        </a>
        );
      })}
    </div>
  );
}

              </div>
              <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                {filterTabs.map((f,i)=>(<button key={i} onClick={f.onClick} style={{border:'1px solid '+f.border,borderRadius:99,padding:'6px 12px',fontSize:12,fontWeight:600,background:f.bg,color:f.color}}>{f.label}</button>))}
              </div>
              <button onClick={()=>{setPoolFilter('all');setPoolSearch('');}} style={{display:'inline-flex',alignItems:'center',gap:4,border:'1px solid #e7eaef',background:'#fff',borderRadius:9,padding:'6px 11px',fontSize:12,color:'#8a93a3',fontWeight:600}}>{ms('filter_alt_off',16)}เคลียร์</button>
            </div>
            <div style={{maxHeight:560,overflowY:'auto',paddingRight:3}}>
              {poolView.map(p=>(
                <div key={p.id} style={{display:'flex',alignItems:'center',gap:11,padding:10,border:'1px solid #eef0f4',borderRadius:10,marginBottom:8}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',alignItems:'flex-start',gap:7}}>
                      <span style={{width:18,height:18,borderRadius:'50%',background:p.avatarColor,color:'#fff',fontSize:10,fontWeight:700,display:'inline-flex',alignItems:'center',justifyContent:'center',flex:'none',marginTop:1}}>{p.avatarInitial}</span>
                      <div style={{fontWeight:600,fontSize:13,lineHeight:1.35}}>{p.title}</div>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:9,marginTop:6,flexWrap:'wrap',fontSize:11,color:'#8a93a3',paddingLeft:25}}>
                      <span style={{display:'inline-flex',alignItems:'center',gap:3,color:primary,fontWeight:600}}>{p.metaLeft}</span>
                      <span style={{display:'inline-flex',alignItems:'center',gap:3}}>{ms('event',13)}{p.due}</span>
                      <span style={{display:'inline-flex',alignItems:'center',gap:3,color:p.daysColor,fontWeight:600}}>{p.days}</span>
                      <span style={{padding:'1px 8px',borderRadius:99,fontWeight:600,background:p.prBg,color:p.prText}}>{p.prLabel}</span>
                    </div>
                  </div>
                  <button onClick={p.onImport} style={{width:38,height:38,borderRadius:'50%',border:'none',background:primary,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',flex:'none'}}>{ms('add',22)}</button>
                </div>
              ))}
              {poolView.length===0 && <div style={{textAlign:'center',color:'#aeb6c2',fontSize:13,padding:'30px 0'}}>ไม่พบคำสั่งการตามตัวกรอง</div>}
            </div>
          </div>
        </div>
       </div>
      )}

      {/* PRIORITY — Team Priority Work List (รายการงานสำคัญของทีม) */}
      {isPriority && (
       <div style={{maxWidth:1480,margin:'0 auto',animation:'fadeIn .2s ease'}}>
        <div style={{display:'flex',alignItems:'center',gap:11,marginBottom:8,flexWrap:'wrap'}}>
          <button onClick={()=>setView('dashboard')} style={{width:36,height:36,borderRadius:9,border:'1px solid #e3e7ec',background:'#fff',display:'inline-flex',alignItems:'center',justifyContent:'center',color:'#5a6473',flex:'none'}}>{ms('arrow_back',22)}</button>
          {ms('format_list_bulleted',22,primary)}
          <div>
            <div style={{fontWeight:700,fontSize:17,lineHeight:1.2}}>Team Priority Work List</div>
            <div style={{fontSize:13,color:'#8a93a3'}}>รายการงานสำคัญของทีม — กระดานงานที่จัดลำดับไว้แล้ว</div>
          </div>
          <div style={{flex:1}}></div>
          <button onClick={()=>setAddBoardOpen(true)} style={{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:6,height:40,padding:'0 18px',background:primary,border:'none',color:'#fff',borderRadius:11,fontSize:13,fontWeight:600,flex:'none'}}>{ms('group_add',18)}เพิ่มกระดานของคนอื่น</button>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:16,background:'#eef0f3',borderRadius:12,padding:'10px 15px',marginBottom:16,fontSize:12,color:'#5a6473',flexWrap:'wrap'}}>
          <span style={{display:'inline-flex',alignItems:'center',gap:6,fontWeight:600}}>{ms('groups',17,primary)}{priorityBoards.length} กระดาน</span>
          <span style={{width:1,height:14,background:'#d4dae2'}}></span>
          <span style={{display:'inline-flex',alignItems:'center',gap:6}}><span style={{padding:'2px 8px',borderRadius:8,fontWeight:600,background:primarySoft,color:primary}}>ของฉัน</span><span style={{padding:'2px 8px',borderRadius:8,fontWeight:600,background:'#ecebfb',color:'#4f46e5'}}>ลูกทีม</span><span style={{padding:'2px 8px',borderRadius:8,fontWeight:600,background:'#eef1f5',color:'#6b7280'}}>อื่นๆ</span></span>
          <div style={{flex:1}}></div>
          <span style={{display:'inline-flex',alignItems:'center',gap:5}}>{ms('swap_vert',15,primary)}กระดานของฉันและลูกทีม กดปุ่มเพื่อแก้ไขลำดับงานได้ทันที</span>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(540px,1fr))',gap:16,alignItems:'start'}}>
          {priorityBoards.map(b=>(
            <div key={b.key} style={{background:'#fff',border:'1px solid #eceef2',borderRadius:14,boxShadow:'0 1px 2px rgba(16,24,40,.04)',overflow:'hidden',minHeight:340,display:'flex',flexDirection:'column'}}>
              {/* board header */}
              <div style={{display:'flex',alignItems:'center',gap:12,padding:'14px 16px',borderBottom:'1px solid #f1f3f6'}}>
                <div style={{width:44,height:44,borderRadius:'50%',background:b.avatarColor,color:'#fff',fontWeight:700,fontSize:18,display:'flex',alignItems:'center',justifyContent:'center',flex:'none'}}>{b.avatarChar}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <span style={{fontWeight:700,fontSize:14.5,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{b.name}</span>
                    {b.badge!=='อื่นๆ' && <span style={{padding:'2px 8px',borderRadius:8,fontSize:11,fontWeight:700,background:b.badgeBg,color:b.badgeText,flex:'none'}}>{b.badge}</span>}
                  </div>
                  <div style={{fontSize:12,color:'#8a93a3',marginTop:2}}>{b.role}</div>
                </div>
                <div style={{textAlign:'right',flex:'none'}}>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <div style={{width:74,height:7,background:'#eef1f5',borderRadius:99,overflow:'hidden'}}><div style={{height:'100%',borderRadius:99,background:primary,width:b.avgStyle}}></div></div>
                    <span style={{fontWeight:700,fontSize:13,color:primary,minWidth:34,textAlign:'right'}}>{b.avgStyle}</span>
                  </div>
                  <div style={{fontSize:10.5,color:'#9aa3af',marginTop:3}}>{b.total} งาน · {b.done} ปิด · {b.over} เกินกำหนด</div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:6,flex:'none'}}>
                  {b.key!=='me' && <button onClick={b.onMsg} title="ฝากข้อความขอปรับลำดับ" style={{width:32,height:32,borderRadius:9,background:'#fff',border:'1px solid #e7eaef',color:'#5a6473',display:'inline-flex',alignItems:'center',justifyContent:'center'}}>{ms('chat',17)}</button>}
                  {b.editable && <button onClick={b.onLog} title="ดูประวัติการเปลี่ยนแปลง" style={{width:32,height:32,borderRadius:9,background:'#fff',border:'1px solid #e7eaef',color:'#5a6473',display:'inline-flex',alignItems:'center',justifyContent:'center'}}>{ms('schedule',17)}</button>}
                  {b.editable ? (
                    <button onClick={b.onEdit} title="จัดการ Prioritize Daily Job" style={{width:32,height:32,borderRadius:9,background:primarySoft,border:'1px solid '+primarySoftBorder,color:primary,display:'inline-flex',alignItems:'center',justifyContent:'center'}}>{ms('swap_vert',18)}</button>
                  ) : (
                    <button onClick={b.onRemove} title="นำกระดานออก" style={{width:32,height:32,borderRadius:9,background:'#fff',border:'1px solid #e7eaef',color:'#8a93a3',display:'inline-flex',alignItems:'center',justifyContent:'center'}}>{ms('close',16)}</button>
                  )}
                </div>
              </div>

              {/* table */}
              <div style={{padding:'6px 16px 4px',flex:1}}>
                <div style={{display:'grid',gridTemplateColumns:'28px 1fr 96px 92px 60px',alignItems:'center',gap:8,padding:'8px 4px',fontSize:11,fontWeight:700,color:'#9aa3af',borderBottom:'1px solid #f1f3f6'}}>
                  <div style={{textAlign:'center'}}>#</div><div>งาน</div><div>ผู้สั่งการ</div><div>กำหนด/เหลือ</div><div style={{textAlign:'right'}}>คืบหน้า</div>
                </div>
                {b.rows.map(job=>(
                  <div key={job.id} style={{display:'grid',gridTemplateColumns:'28px 1fr 96px 92px 60px',alignItems:'center',gap:8,padding:'9px 4px',borderBottom:'1px solid #f5f6f9'}}>
                    <div style={{textAlign:'center',fontWeight:700,fontSize:15,color:'#4338ca'}}>{job.rank}</div>
                    <div style={{minWidth:0}}>
                      <div style={{fontWeight:500,fontSize:12.5,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{job.title}</div>
                      <div style={{marginTop:5,height:5,background:'#eef1f5',borderRadius:99,overflow:'hidden',maxWidth:200}}><div style={{height:'100%',borderRadius:99,background:job.barColor,width:job.widthStyle}}></div></div>
                    </div>
                    <div style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:11.5,color:'#5a6473',minWidth:0}}>
                      <span style={{width:18,height:18,borderRadius:'50%',background:job.avatarColor,color:'#fff',fontSize:10,fontWeight:700,display:'inline-flex',alignItems:'center',justifyContent:'center',flex:'none'}}>{job.avatarInitial}</span>
                      <span style={{whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{job.commander}</span>
                    </div>
                    <div style={{fontSize:11,lineHeight:1.35}}>
                      <div style={{color:'#8a93a3'}}>{job.due}</div>
                      <div style={{color:job.daysColor,fontWeight:600}}>{job.days}</div>
                    </div>
                    <div style={{display:'inline-flex',alignItems:'center',justifyContent:'flex-end',gap:6}}>
                      <span style={{fontWeight:700,fontSize:12,color:job.barColor}}>{job.widthStyle}</span>
                      <span style={{width:10,height:10,borderRadius:'50%',background:job.statusColor,flex:'none'}}></span>
                    </div>
                  </div>
                ))}
                {b.total===0 && <div style={{textAlign:'center',color:'#aeb6c2',fontSize:12.5,padding:'22px 0'}}>ยังไม่มีงานในกระดานนี้</div>}
              </div>

              {/* board footer */}
              {b.total>3 && (
              <div style={{display:'flex',alignItems:'center',justifyContent:'flex-end',gap:9,padding:'11px 16px 14px'}}>
                <button onClick={b.onToggle} style={{display:'inline-flex',alignItems:'center',gap:5,height:32,padding:'0 12px',background:'#f4f6f9',border:'1px solid #e7eaef',color:'#5a6473',borderRadius:11,fontSize:12,fontWeight:600}}>{ms(b.expanded?'expand_less':'expand_more',16)}{b.expanded?'ย่อกลับ':'ดูทั้งหมด ('+b.total+' งาน)'}</button>
              </div>
              )}
            </div>
          ))}
        </div>

        {/* add-board modal */}
        {addBoardOpen && (
         <div onClick={()=>setAddBoardOpen(false)} style={{position:'fixed',inset:0,background:'rgba(16,24,40,.4)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:200,animation:'fadeIn .15s ease'}}>
          <div onClick={(e)=>e.stopPropagation()} style={{width:460,maxWidth:'92vw',maxHeight:'82vh',background:'#fff',borderRadius:14,boxShadow:'0 18px 50px rgba(16,24,40,.24)',display:'flex',flexDirection:'column',overflow:'hidden',animation:'popIn .18s ease'}}>
            <div style={{display:'flex',alignItems:'center',gap:9,padding:'15px 18px',borderBottom:'1px solid #f1f3f6'}}>
              {ms('group_add',20,primary)}
              <div style={{fontWeight:700,fontSize:15,flex:1}}>เพิ่มกระดานของคนอื่น</div>
              <button onClick={()=>setAddBoardOpen(false)} style={{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:5,height:40,padding:'0 14px',background:'#fff',border:'1px solid #e3e7ec',color:'#5a6473',borderRadius:11,fontSize:12.5,fontWeight:600}}>{ms('close',16)}ปิด</button>
            </div>
            <div style={{padding:14,overflowY:'auto'}}>
              {addable.map(o=>(
                <div key={o.id} style={{display:'flex',alignItems:'center',gap:11,padding:'10px 11px',border:'1px solid #eef0f4',borderRadius:11,marginBottom:8}}>
                  <div style={{width:38,height:38,borderRadius:'50%',background:o.avatarColor,color:'#fff',fontWeight:700,fontSize:15,display:'flex',alignItems:'center',justifyContent:'center',flex:'none'}}>{o.avatarChar}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:600,fontSize:13,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{o.name}</div>
                    <div style={{fontSize:11.5,color:'#8a93a3'}}>{o.role} · {o.dept}</div>
                  </div>
                  <span style={{fontSize:11,color:'#9aa3af',flex:'none'}}>{o.count} งาน</span>
                  <button onClick={o.onAdd} style={{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:5,height:32,padding:'0 13px',background:primary,border:'none',color:'#fff',borderRadius:11,fontSize:12,fontWeight:600,flex:'none'}}>{ms('add',16)}เพิ่ม</button>
                </div>
              ))}
              {addable.length===0 && <div style={{textAlign:'center',color:'#aeb6c2',fontSize:13,padding:'30px 0'}}>เพิ่มครบทุกกระดานแล้ว</div>}
            </div>
          </div>
         </div>
        )}

        {/* message modal — ฝากข้อความขอปรับลำดับ */}
        {msgModal && (
         <div onClick={()=>setMsgModal(null)} style={{position:'fixed',inset:0,background:'rgba(16,24,40,.4)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:200,animation:'fadeIn .15s ease'}}>
          <div onClick={(e)=>e.stopPropagation()} style={{width:460,maxWidth:'92vw',background:'#fff',borderRadius:14,boxShadow:'0 18px 50px rgba(16,24,40,.24)',overflow:'hidden',animation:'popIn .18s ease'}}>
            <div style={{display:'flex',alignItems:'center',gap:9,padding:'15px 18px',borderBottom:'1px solid #f1f3f6'}}>
              {ms('chat',20,primary)}
              <div style={{fontWeight:700,fontSize:15,flex:1}}>ฝากข้อความขอปรับลำดับงาน</div>
              <button onClick={()=>setMsgModal(null)} style={{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:5,height:40,padding:'0 14px',background:'#fff',border:'1px solid #e3e7ec',color:'#5a6473',borderRadius:11,fontSize:12.5,fontWeight:600}}>{ms('close',16)}ปิด</button>
            </div>
            <div style={{padding:'16px 18px'}}>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
                <div style={{width:38,height:38,borderRadius:'50%',background:msgModal.avatarColor,color:'#fff',fontWeight:700,fontSize:15,display:'flex',alignItems:'center',justifyContent:'center',flex:'none'}}>{msgModal.avatarChar}</div>
                <div><div style={{fontSize:11.5,color:'#9aa3af'}}>ส่งถึง</div><div style={{fontWeight:700,fontSize:13.5}}>{msgModal.name} <span style={{color:'#8a93a3',fontWeight:500,fontSize:12}}>· {msgModal.role}</span></div></div>
              </div>
              {msgSent ? (
                <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8,padding:'24px 0',color:'#22b573'}}>{ms('check_circle',40,'#22b573')}<div style={{fontWeight:700,fontSize:14,color:'#1f2733'}}>ส่งข้อความแล้ว</div><div style={{fontSize:12,color:'#8a93a3'}}>{msgModal.name} จะได้รับการแจ้งเตือนให้ปรับลำดับงาน</div></div>
              ) : (
                <div>
                  <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:11}}>
                    {['ช่วยดันงานด่วนขึ้นก่อนนะครับ','ขอให้ทบทวนลำดับความสำคัญใหม่','งานตามสัญญาควรอยู่ลำดับต้น ๆ'].map((t,i)=>(
                      <button key={i} onClick={()=>setMsgText(t)} style={{border:'1px solid #e3e7ec',background:'#f7f9fb',color:'#5a6473',borderRadius:8,padding:'5px 11px',fontSize:11.5,fontWeight:500}}>{t}</button>
                    ))}
                  </div>
                  <textarea value={msgText} onChange={(e)=>setMsgText(e.target.value)} placeholder="พิมพ์ข้อความถึงเจ้าของกระดาน เช่น ระบุงานที่อยากให้ดันขึ้น/ลง และเหตุผล" style={{width:'100%',minHeight:96,resize:'vertical',border:'1px solid #e3e7ec',borderRadius:11,padding:'11px 12px',fontSize:13,fontFamily:'inherit',color:'#1f2733',outline:'none',boxSizing:'border-box'}}></textarea>
                  <div style={{display:'flex',alignItems:'center',gap:9,marginTop:14}}>
                    <button onClick={()=>setMsgModal(null)} style={{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:6,height:40,padding:'0 18px',background:'#fff',border:'1px solid #e3e7ec',color:'#5a6473',borderRadius:11,fontSize:13,fontWeight:600}}>{ms('close',16)}ยกเลิก</button>
                    <div style={{flex:1}}></div>
                    <button onClick={()=>{if(msgText.trim())setMsgSent(true);}} disabled={!msgText.trim()} style={{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:6,height:40,padding:'0 18px',background:msgText.trim()?primary:'#cbd5e1',border:'none',color:'#fff',borderRadius:11,fontSize:13,fontWeight:600,cursor:msgText.trim()?'pointer':'default'}}>{ms('send',16)}ส่งข้อความ</button>
                  </div>
                </div>
              )}
            </div>
          </div>
         </div>
        )}

        {/* log modal — ประวัติการเปลี่ยนแปลงลำดับงาน */}
        {logModal && (
         <div onClick={()=>setLogModal(null)} style={{position:'fixed',inset:0,background:'rgba(16,24,40,.4)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:200,animation:'fadeIn .15s ease'}}>
          <div onClick={(e)=>e.stopPropagation()} style={{width:520,maxWidth:'92vw',maxHeight:'82vh',background:'#fff',borderRadius:14,boxShadow:'0 18px 50px rgba(16,24,40,.24)',display:'flex',flexDirection:'column',overflow:'hidden',animation:'popIn .18s ease'}}>
            <div style={{display:'flex',alignItems:'center',gap:9,padding:'15px 18px',borderBottom:'1px solid #f1f3f6'}}>
              {ms('schedule',20,primary)}
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontSize:15}}>ประวัติการเปลี่ยนแปลงลำดับงาน</div>
                <div style={{fontSize:12,color:'#8a93a3'}}>{logModal.name} · {logModal.badge==='ของฉัน'?'กระดานของฉัน':'ลูกทีม'}</div>
              </div>
              <button onClick={()=>setLogModal(null)} style={{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:5,height:40,padding:'0 14px',background:'#fff',border:'1px solid #e3e7ec',color:'#5a6473',borderRadius:11,fontSize:12.5,fontWeight:600}}>{ms('close',16)}ปิด</button>
            </div>
            <div style={{padding:'8px 18px 16px',overflowY:'auto'}}>
              {logModal.logs.map((e,i)=>{
                const st=e.action==='add'?{bg:'#e4f4ec',color:'#22b573',icon:'add',label:'เพิ่มงาน'}:e.action==='remove'?{bg:'#fdeaea',color:'#d83a3a',icon:'delete',label:'ลบงาน'}:{bg:primarySoft,color:primary,icon:'swap_vert',label:'เปลี่ยนลำดับ'};
                return (
                <div key={i} style={{display:'flex',gap:12,padding:'12px 0',borderBottom:i<logModal.logs.length-1?'1px solid #f5f6f9':'none'}}>
                  <div style={{width:34,height:34,borderRadius:9,background:st.bg,display:'flex',alignItems:'center',justifyContent:'center',flex:'none'}}>{ms(st.icon,18,st.color)}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:3}}>
                      <span style={{padding:'2px 8px',borderRadius:8,fontSize:11,fontWeight:700,background:st.bg,color:st.color}}>{st.label}</span>
                      <span style={{fontSize:11,color:'#9aa3af'}}>{e.time}</span>
                    </div>
                    <div style={{fontWeight:600,fontSize:13,marginBottom:2}}>{e.title}</div>
                    <div style={{fontSize:12,color:'#5a6473'}}>{e.detail}</div>
                    <div style={{fontSize:11,color:'#9aa3af',marginTop:3}}>โดย {e.by}</div>
                  </div>
                </div>
                );
              })}
              {logModal.logs.length===0 && <div style={{textAlign:'center',color:'#aeb6c2',fontSize:13,padding:'30px 0'}}>ยังไม่มีประวัติการเปลี่ยนแปลง</div>}
            </div>
          </div>
         </div>
        )}
       </div>
      )}
      </div>
    </GD5AppShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
(async function(){
  var shellSrc='';
  try{ shellSrc=await (await fetch('gd5-app-shell.jsx')).text(); }catch(e){}
  var pageSrc=document.getElementById('jsx-src').textContent;
  var out=Babel.transform(shellSrc+'\n'+pageSrc,{presets:[['react',{runtime:'classic'}]]}).code;
  new Function(out)();
})();
</script>
</body>
</html>
