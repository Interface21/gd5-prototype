/* คำนวณยอดใช้จ่ายตามรอบการวัดผล: อนาคต = ยังไม่ใช้จ่าย, อดีตที่ปิดรอบ = ใช้จ่ายเต็ม (mock) */
function scaleSpent(nodes,factor){
  return nodes.map(n=>({...n,spentSelf:Math.round((n.spentSelf||0)*factor),children:scaleSpent(n.children||[],factor)}));
}
const DATA_BY_ROUND={
  r1:MISSIONS_BASE,
  r2:scaleSpent(MISSIONS_BASE,0),
  r3:scaleSpent(MISSIONS_BASE,1.18),
  r4:scaleSpent(MISSIONS_BASE,1.05),
};

const dailyOf=(n)=>Math.round((n.spentSelf||0)*0.4);
const investSelf=(n)=>(n.spentSelf||0);                        // ใช้จ่ายงบลงทุนที่แผนนี้โดยตรง
const operateSelf=(n)=>dailyOf(n);                             // ใช้จ่ายงบดำเนินการที่แผนนี้โดยตรง
const investUsed=(n)=>investSelf(n)+(n.children||[]).reduce((s,c)=>s+investUsed(c),0);   // รวมแผนใต้ทั้งหมด
const operateUsed=(n)=>operateSelf(n)+(n.children||[]).reduce((s,c)=>s+operateUsed(c),0);

];
const baht=(n)=>Math.round(n).toLocaleString();
/* ย่อจำนวนเงินสำหรับพื้นที่แคบ: 1,250,000 → 1.25 ล้าน */
const bahtShort=(n)=>{
  n=Math.round(n);
  if(n>=1000000) return (n/1000000).toLocaleString(undefined,{maximumFractionDigits:2})+' ล้าน';
  if(n>=1000) return (n/1000).toLocaleString(undefined,{maximumFractionDigits:0})+'k';
  return n.toLocaleString();
};

/* แผ่ต้นไม้เป็น flat list พร้อม depth + parent id (เพื่อทำตาราง/สรุปตามระดับ) */
function flatten(nodes,depth,acc){
  acc=acc||[];
  (nodes||[]).forEach(n=>{ acc.push({node:n,depth:depth}); flatten(n.children,depth+1,acc); });
  return acc;
}

  return (
    <div>
      <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',gap:6,marginBottom:5}}>
        <span style={{fontSize:12.5,fontWeight:700,color:over?RED:'#1a2332'}}>{baht(used)}</span>
        <span style={{fontSize:11,color:'#9aa3af'}}>/ {bahtShort(budget)}</span>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:7}}>
        <div style={{flex:1,height:7,background:'#eef0f3',borderRadius:99,overflow:'hidden'}}>
          <div style={{width:Math.min(100,pct)+'%',height:'100%',background:over?RED:def.bar,borderRadius:99}}></div>
        </div>
        <span style={{fontSize:11,fontWeight:800,color:over?RED:def.color,width:38,textAlign:'right',flex:'none'}}>{Math.round(pct)}%</span>
      </div>
    </div>
  );
}

/* ══════════════ จุดเฝ้าระวังการใช้จ่าย (ranked watchlist ข้ามทุกระดับ) ══════════════
   ต่างจากตารางต้นไม้: ตารางต้นไม้ = โครงสร้างครบทุกแผนตามลำดับชั้น (ดูภาพรวม/ไล่ดู)
   บล็อกนี้ = ดึงเฉพาะแผนที่ "ใช้เกินงบ / ใกล้เต็มงบ" จัดอันดับข้ามทุกระดับ+ทั้ง 2 งบ
   เพื่อให้ผู้ตรวจเห็นจุดเสี่ยงทันทีโดยไม่ต้องไล่กางตาราง */
const WATCH_THRESHOLD=80; // % เริ่มเฝ้าระวัง
function Watchlist({missions}){
  const [bf,setBf]=useState('all'); // กรองประเภทงบ: all | invest | operate
  const flat=flatten(missions,0);
  const entries=[];
  flat.forEach(f=>{
    const n=f.node;
    [[INV,n.investBudget,investUsed(n)],[OPR,n.operateBudget,operateUsed(n)]].forEach(([def,budget,used])=>{
      if(budget==null||budget<=0) return;
      if(bf!=='all'&&def.key!==bf) return;
      const pct=used/budget*100;
      if(pct>=WATCH_THRESHOLD) entries.push({node:n,depth:f.depth,def,budget,used,pct,over:used>budget});
    });
  });
  entries.sort((a,b)=>b.pct-a.pct);
  const overCount=entries.filter(e=>e.over).length;
  const warnCount=entries.length-overCount;
  const chip=(id,label,def)=>{
    const on=bf===id;
    const c=def?def.color:primary, bg=def?def.bg:primarySoft, bd=def?def.bd:primary;
    return (
      <button key={id} onClick={()=>setBf(id)} style={{display:'inline-flex',alignItems:'center',gap:6,height:30,padding:'0 12px',borderRadius:8,border:'1px solid '+(on?bd:'#e3e7ec'),background:on?bg:'#fff',color:on?c:'#5a6473',fontSize:12,fontWeight:on?700:500,cursor:'pointer'}}>
        {def&&<i className={'bi '+def.icon} style={{fontSize:11}}></i>}{label}
      </button>
    );
  };
  return (
    <div style={{background:'#fff',border:'1px solid #eceef2',borderRadius:14,boxShadow:'0 1px 3px rgba(16,24,40,.04)',overflow:'hidden'}}>
      <div style={{display:'flex',alignItems:'center',gap:9,padding:'16px 20px',borderBottom:'1px solid #f0f2f5',flexWrap:'wrap'}}>
        <i className="bi bi-exclamation-diamond" style={{fontSize:17,color:'#d9822b'}}></i>
        <span style={{fontWeight:700,fontSize:14.5}}>จุดเฝ้าระวังการใช้จ่ายงบประมาณ</span>
        <div style={{flex:1}}></div>
        <span style={{display:'inline-flex',alignItems:'center',gap:6,height:26,padding:'0 11px',borderRadius:8,fontSize:12,fontWeight:700,background:'#fdeaea',color:RED,border:'1px solid #f5c6c6'}}><i className="bi bi-arrow-up-right-circle" style={{fontSize:12}}></i>ใช้เกินงบ {overCount}</span>
        <span style={{display:'inline-flex',alignItems:'center',gap:6,height:26,padding:'0 11px',borderRadius:8,fontSize:12,fontWeight:700,background:'#fff4df',color:'#b06200',border:'1px solid #f6dca8'}}><i className="bi bi-hourglass-split" style={{fontSize:12}}></i>ใกล้เต็มงบ {warnCount}</span>
      </div>
      {/* filter ประเภทงบ */}
      <div style={{display:'flex',alignItems:'center',gap:8,padding:'12px 20px',borderBottom:'1px solid #f4f6f8',flexWrap:'wrap'}}>
        <span style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:12,fontWeight:700,color:'#8a93a3',marginRight:2}}><i className="bi bi-funnel" style={{fontSize:12}}></i>ประเภทงบ</span>
        {chip('all','ทั้งหมด',null)}
        {chip('invest',INV.label,INV)}
        {chip('operate',OPR.label,OPR)}
      </div>
      {entries.length===0?(
        <div style={{padding:'34px 20px',textAlign:'center',color:'#8a93a3',fontSize:13}}>
          <i className="bi bi-shield-check" style={{fontSize:26,color:'#bfe0d9'}}></i>
          <div style={{marginTop:8,fontWeight:600}}>ไม่มีแผนที่ใช้จ่ายถึงเกณฑ์เฝ้าระวัง ({WATCH_THRESHOLD}% ขึ้นไป) ในรอบนี้</div>
        </div>
      ):(
        <div>
          {entries.map((e,i)=>{
            const st=LEVEL_STYLE[e.depth];
            const c=e.over?RED:'#d9822b';
            return (
              <div key={e.node.id+e.def.key} style={{display:'flex',alignItems:'center',gap:13,padding:'12px 20px',borderBottom:i<entries.length-1?'1px solid #f4f6f8':'none'}}>
                <span style={{fontSize:12.5,fontWeight:800,color:'#b3bac4',width:20,textAlign:'center',flex:'none'}}>{i+1}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:3,flexWrap:'wrap'}}>
                    <span style={{display:'inline-flex',alignItems:'center',height:22,padding:'0 8px',borderRadius:8,fontSize:10.5,fontWeight:700,background:st.bg,color:st.color,border:'1px solid '+st.bd,flex:'none'}}>{LEVEL_NAME[e.depth]}</span>
                    <span style={{display:'inline-flex',alignItems:'center',gap:5,height:22,padding:'0 8px',borderRadius:8,fontSize:10.5,fontWeight:700,background:e.def.bg,color:e.def.color,border:'1px solid '+e.def.bd,flex:'none'}}><i className={'bi '+e.def.icon} style={{fontSize:10}}></i>{e.def.label}</span>
                    <span style={{fontSize:13.5,fontWeight:700,color:'#1a2332',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.node.title}</span>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:9}}>
                    <div style={{flex:1,maxWidth:260,height:7,background:'#eef0f3',borderRadius:99,overflow:'hidden'}}>
                      <div style={{width:Math.min(100,e.pct)+'%',height:'100%',background:c,borderRadius:99}}></div>
                    </div>
                    <span style={{fontSize:11.5,color:'#9aa3af',flex:'none'}}>ใช้ <b style={{color:c}}>{baht(e.used)}</b> / {bahtShort(e.budget)}</span>
                  </div>
                </div>
                <div style={{textAlign:'right',flex:'none'}}>
                  <div style={{fontSize:17,fontWeight:800,color:c,lineHeight:1}}>{Math.round(e.pct)}%</div>
                  <div style={{fontSize:10.5,fontWeight:700,color:c,marginTop:3}}>{e.over?'เกินงบ '+baht(e.used-e.budget):'เหลือ '+baht(e.budget-e.used)}</div>
                </div>
              </div>
            );
          })}
        </div>
      )}
      <div style={{display:'flex',alignItems:'flex-start',gap:8,fontSize:11.5,color:'#9aa3af',padding:'13px 20px',lineHeight:1.6,borderTop:'1px solid #f4f6f8'}}>
        <i className="bi bi-info-circle" style={{fontSize:13,flex:'none',marginTop:1}}></i>
        <span>รวมทุกแผนทุกระดับที่ใช้จ่ายตั้งแต่ {WATCH_THRESHOLD}% ของงบที่ตั้งไว้ขึ้นไป แยกตามงบลงทุน/งบดำเนินการ เรียงจากสัดส่วนการใช้จ่ายมากไปน้อย — ดูโครงสร้างครบทุกแผนได้ที่ตารางด้านล่าง</span>
      </div>
    </div>
  );
}

/* ══════════════ แถวต้นไม้ในตารางรายละเอียด ══════════════ */
function TreeRow({node,depth,expanded,onToggle}){
  const kids=node.children||[];
  const hasKids=kids.length>0;
  const st=LEVEL_STYLE[depth];
  const invB=node.investBudget, opB=node.operateBudget;
  return (
    <div className="brow" style={{display:'grid',gridTemplateColumns:'minmax(320px,2.4fr) 1fr 1fr',gap:0,alignItems:'center',padding:'11px 18px',borderBottom:'1px solid #f4f6f8',cursor:hasKids?'pointer':'default'}} onClick={()=>hasKids&&onToggle(node.id)}>
      <div style={{display:'flex',alignItems:'center',gap:9,paddingLeft:depth*22,minWidth:0}}>
        <span style={{width:22,height:22,borderRadius:6,display:'inline-flex',alignItems:'center',justifyContent:'center',flex:'none',background:hasKids?'#eef1f4':'transparent',color:'#5a6473'}}>
          {hasKids && <i className={'bi '+(expanded?'bi-chevron-down':'bi-chevron-right')} style={{fontSize:12}}></i>}
        </span>
        <span style={{display:'inline-flex',alignItems:'center',height:22,padding:'0 8px',borderRadius:8,fontSize:10.5,fontWeight:700,background:st.bg,color:st.color,border:'1px solid '+st.bd,flex:'none'}}>{LEVEL_NAME[depth]}</span>
        <div style={{minWidth:0}}>
          <div style={{fontSize:13.5,fontWeight:depth<2?700:600,color:'#1a2332',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{node.title}</div>
          <div style={{fontSize:11.5,color:'#9aa3af',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{node.owner}</div>
        </div>
      </div>
      <div style={{padding:'0 14px'}}><MiniBudget def={INV} budget={invB} used={investUsed(node)} none={invB==null}/></div>
      <div style={{padding:'0 14px'}}><MiniBudget def={OPR} budget={opB} used={operateUsed(node)} none={opB==null}/></div>
    </div>
  );
}

function TreeTable({missions,expanded,setExpanded}){
  // สร้างลำดับแถวตาม expand state
  const rows=[];
  const walk=(nodes,depth)=>{
    nodes.forEach(n=>{
      rows.push({node:n,depth});
      if(expanded[n.id]) walk(n.children||[],depth+1);
    });
  };
  walk(missions,0);
  const allIds=flatten(missions,0).filter(f=>(f.node.children||[]).length>0).map(f=>f.node.id);
  const allOpen=allIds.every(id=>expanded[id]);
  return (
    <div style={{background:'#fff',border:'1px solid #eceef2',borderRadius:14,boxShadow:'0 1px 3px rgba(16,24,40,.04)',overflow:'hidden'}}>
      <div style={{display:'flex',alignItems:'center',gap:9,padding:'16px 20px',borderBottom:'1px solid #f0f2f5',flexWrap:'wrap'}}>
        <i className="bi bi-diagram-3" style={{fontSize:17,color:primary}}></i>
        <span style={{fontWeight:700,fontSize:14.5}}>รายงานการใช้จ่ายตามแผนแต่ละระดับ</span>
        <div style={{flex:1}}></div>
        <button onClick={()=>{const nx={};if(!allOpen)allIds.forEach(id=>nx[id]=true);setExpanded(nx);}} style={{height:32,display:'inline-flex',alignItems:'center',justifyContent:'center',gap:6,padding:'0 14px',borderRadius:8,border:'1px solid #e3e7ec',background:'#fff',color:'#3a4452',fontSize:12,fontWeight:700}}>
          <i className={'bi '+(allOpen?'bi-arrows-collapse':'bi-arrows-expand')} style={{fontSize:13}}></i>{allOpen?'ยุบทั้งหมด':'ขยายทั้งหมด'}
        </button>
      </div>
      {/* column head */}
      <div style={{display:'grid',gridTemplateColumns:'minmax(320px,2.4fr) 1fr 1fr',gap:0,padding:'10px 18px',background:'#fafbfc',borderBottom:'1px solid #f0f2f5',fontSize:11.5,fontWeight:700,color:'#8a93a3'}}>
        <div>แผนธุรกิจ (ทุกระดับ — คลิกเพื่อขยาย/ยุบ)</div>
        <div style={{padding:'0 14px',display:'flex',alignItems:'center',gap:6,color:INV.color}}><i className={'bi '+INV.icon} style={{fontSize:12}}></i>งบลงทุน (ใช้ / ตั้งไว้)</div>
        <div style={{padding:'0 14px',display:'flex',alignItems:'center',gap:6,color:OPR.color}}><i className={'bi '+OPR.icon} style={{fontSize:12}}></i>งบดำเนินการ (ใช้ / ตั้งไว้)</div>
      </div>
      {rows.length===0?(
        <div style={{padding:'40px 20px',textAlign:'center',color:'#b3bac4',fontSize:13}}>ไม่พบแผนธุรกิจที่ตรงกับเงื่อนไข</div>
      ):rows.map(r=>(
        <TreeRow key={r.node.id} node={r.node} depth={r.depth} expanded={!!expanded[r.node.id]} onToggle={(id)=>setExpanded(e=>({...e,[id]:!e[id]}))}/>
      ))}
      <div style={{display:'flex',alignItems:'flex-start',gap:8,fontSize:11.5,color:'#9aa3af',padding:'13px 20px',lineHeight:1.6,borderTop:'1px solid #f4f6f8'}}>
        <i className="bi bi-info-circle" style={{fontSize:13,flex:'none',marginTop:1}}></i>
        <span>ยอด "ใช้ไป" ของแต่ละแผน = ยอดใช้จ่ายที่บันทึกในแผนนั้น รวมกับยอดของแผนที่อยู่ใต้ทุกระดับ — เปอร์เซ็นต์เทียบกับงบที่ตั้งไว้ของแผนนั้น (สีแดง = ใช้เกินงบ) ยอดคำนวณตามรอบการวัดผลที่เลือก</span>
      </div>
    </div>
  );
}

function BudgetAuditContent(){
  const [round,setRound]=useState(ROUNDS[0].id);
  const [mission,setMission]=useState('all');
  const [tab,setTab]=useState('watch');
  const [expanded,setExpanded]=useState(()=>({m1:true,m2:true,m3:true,m4:true}));

  const allMissions=DATA_BY_ROUND[round];
  const missions=mission==='all'?allMissions:allMissions.filter(m=>m.id===mission);

  // ยอดรวมภาพรวม = ผลรวมจากระดับพันธกิจ (rolled up)
  const totals=useMemo(()=>{
    let invB=0,invU=0,opB=0,opU=0;
    missions.forEach(m=>{ invB+=m.investBudget||0; invU+=investUsed(m); opB+=m.operateBudget||0; opU+=operateUsed(m); });
    return {invB,invU,opB,opU};
  },[missions]);

  // จำนวนแผนที่เข้าเกณฑ์เฝ้าระวัง (สำหรับ badge บนแท็บ)
  const watchCount=useMemo(()=>flatten(missions,0).reduce((c,f)=>{
    const n=f.node;
    [[n.investBudget,investUsed(n)],[n.operateBudget,operateUsed(n)]].forEach(([b,u])=>{ if(b>0&&u/b*100>=WATCH_THRESHOLD) c++; });
    return c;
  },0),[missions]);
  return (
    <div style={{flex:1,padding:'24px 28px',overflowY:'auto',height:'calc(100vh - 58px)'}}>
      {/* header */}
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16,flexWrap:'wrap'}}>
        <i className="bi bi-cash-coin" style={{fontSize:20,color:primary}}></i>
        <span style={{fontWeight:700,fontSize:16}}>ตรวจสอบการใช้จ่ายงบประมาณ</span>
        <div style={{flex:1}}></div>
        <RoundSelect round={round} setRound={setRound}/>
      </div>

      {/* filter — พันธกิจ (Level 1) */}
      <div style={{background:'#fff',border:'1px solid #eceef2',borderRadius:14,padding:'13px 18px',boxShadow:'0 1px 3px rgba(16,24,40,.04)',marginBottom:16}}>
        <div style={{display:'flex',alignItems:'center',gap:9,flexWrap:'wrap'}}>
          <span style={{display:'inline-flex',alignItems:'center',gap:7,fontSize:12.5,fontWeight:700,color:'#3a4452',marginRight:2}}><i className="bi bi-funnel" style={{fontSize:14,color:primary}}></i>ขอบเขต</span>
          {[{id:'all',label:'ทั้งองค์กร'},...allMissions.map(m=>({id:m.id,label:m.title}))].map(opt=>{
            const active=mission===opt.id;
            return (
              <button key={opt.id} onClick={()=>setMission(opt.id)} style={{display:'inline-flex',alignItems:'center',gap:7,height:34,padding:'0 14px',borderRadius:8,border:'1px solid '+(active?primary:'#e3e7ec'),background:active?primarySoft:'#fff',color:active?primary:'#5a6473',fontSize:12.5,fontWeight:active?700:500,cursor:'pointer',maxWidth:280,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{opt.label}</button>
            );
          })}
        </div>
      </div>

      {/* ── ภาพรวมทั้งหมด ── */}
      <div style={{fontSize:13,fontWeight:700,color:'#8a93a3',margin:'2px 2px 12px'}}>ภาพรวมการใช้จ่าย{mission==='all'?'ทั้งองค์กร':'ของ'+missions[0].title}</div>
      <div style={{marginBottom:14}}>
        <GrandTotalCard invBudget={totals.invB} invUsed={totals.invU} opBudget={totals.opB} opUsed={totals.opU}/>
      </div>
      <div style={{display:'flex',gap:14,flexWrap:'wrap',marginBottom:22}}>
        <OverviewBudgetCard def={INV} budget={totals.invB} used={totals.invU}/>
        <OverviewBudgetCard def={OPR} budget={totals.opB} used={totals.opU}/>
      </div>

      {/* ── แท็บ: จุดเฝ้าระวัง / รายงานตามแผนแต่ละระดับ (underline style) ── */}
      <div style={{display:'flex',alignItems:'center',gap:26,borderBottom:'1px solid #e7eaef',marginBottom:16}}>
        {[['watch','จุดเฝ้าระวังการใช้จ่าย',watchCount],['tree','รายงานตามแผนแต่ละระดับ',null]].map(([k,label,cnt])=>{
          const on=tab===k;
          return (
            <button key={k} onClick={()=>setTab(k)} style={{display:'inline-flex',alignItems:'center',gap:8,padding:'0 2px 11px',border:'none',background:'none',cursor:'pointer',color:on?primary:'#5a6473',fontSize:14,fontWeight:on?700:500,borderBottom:'2px solid '+(on?primary:'transparent'),marginBottom:-1}}>
              {label}
              {cnt>0&&(
                <span style={{minWidth:19,height:19,borderRadius:99,background:on?'#fdeaea':'#f1f3f6',color:on?RED:'#8a93a3',fontSize:11,fontWeight:800,display:'inline-flex',alignItems:'center',justifyContent:'center',padding:'0 5px'}}>{cnt}</span>
              )}
            </button>
          );
        })}
      </div>
      {tab==='watch'
        ? <Watchlist missions={missions}/>
        : <TreeTable missions={missions} expanded={expanded} setExpanded={setExpanded}/>}
    </div>
  );
}

function App(){
  return (
    <GD5AppShell active="business">
      <LeftNav/>
      <BudgetAuditContent/>
    </GD5AppShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
