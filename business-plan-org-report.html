function scaleTree(nodes,mode){
  return nodes.map(n=>{
    let achieved=n.achieved, status=n.status, spentSelf=n.spentSelf;
    if(mode==='future'){ achieved=0; status=''; spentSelf=0; }
    if(mode==='done'){ achieved=n.target; status=n.target>0?'g':(n.status||''); }
    return {...n,achieved,status,spentSelf,children:n.children?scaleTree(n.children,mode):[]};
  });
}
const DATA_BY_ROUND={ r1:MISSIONS_BASE, r2:scaleTree(MISSIONS_BASE,'future'), r3:scaleTree(MISSIONS_BASE,'done'), r4:scaleTree(MISSIONS_BASE,'done') };

const flattenTree=(nodes)=>nodes.reduce((acc,n)=>acc.concat([n],flattenTree(n.children||[])),[]);
const dailyOf=(n)=>Math.round((n.spentSelf||0)*0.4); // งบจากงานประจำวัน (mock — สัดส่วนของยอดบันทึกเอง)
const usedTotal=(n)=>(n.spentSelf||0)+dailyOf(n)+(n.children||[]).reduce((s,c)=>s+usedTotal(c),0); // งบที่ใช้ไป = บันทึกเอง + งานประจำวัน +
const investUsedOf=(n)=>(n.spentSelf||0)+(n.children||[]).reduce((s,c)=>s+investUsedOf(c),0); // งบลงทุน = บันทึกเอง + แผนใต้
const operateUsedOf=(n)=>dailyOf(n)+(n.children||[]).reduce((s,c)=>s+operateUsedOf(c),0); // งบดำเนินการ = งานประจำวัน + แผนใต้
const budgetKind=(n)=>{ const i=n.investBudget!=null, o=n.operateBudget!=null; return i&&o?'both':i?'invest':o?'operate':'none'; };

  none:   {label:'ไม่ได้ตั้งงบ',icon:'bi-slash-circle',color:'#8a93a3',bg:'#f1f3f6',bd:'#e3e7ec'},
};
function BudgetKindBadge({node}){
  const investSet=node.investBudget!=null, operateSet=node.operateBudget!=null;
  if(!investSet&&!operateSet){
    const b=BUDGET_BADGE.none;
    return (
      <span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:5,height:24,background:b.bg,color:b.color,border:'1px solid '+b.bd,borderRadius:8,padding:'0 10px',fontSize:11,fontWeight:700,whiteSpace:'nowrap',boxSizing:'border-box'}}>
        <i className={'bi '+b.icon} style={{fontSize:11}}></i>{b.label}
      </span>
    );
  }
  const rows=[];
  if(investSet) rows.push({label:'งบลงทุน',color:'#2f66d0',bar:'#3b6fd4',bg:'#eaf1fe',bd:'#d3e2fb',used:investUsedOf(node),budget:node.investBudget});
  if(operateSet) rows.push({label:'งบดำเนินการ',color:'#b06200',bar:'#e59500',bg:'#fff4df',bd:'#f5dcab',used:operateUsedOf(node),budget:node.operateBudget});
  const two=rows.length>1;
  return (
    <div style={{width:two?340:186,display:'flex',flexDirection:two?'row':'column',gap:8,alignItems:'stretch'}}>
      {rows.map((r,i)=>{
        const pct=r.budget>0?r.used/r.budget*100:0;
        const over=pct>100;
        return (
          <div key={i} style={{flex:two?1:'none',display:'flex',alignItems:'center',gap:8,height:24,boxSizing:'border-box',background:r.bg,border:'1px solid '+r.bd,borderRadius:8,padding:'0 10px'}}>
            <span style={{fontSize:10.5,color:r.color,fontWeight:700,flex:'none',whiteSpace:'nowrap'}}>{r.label}</span>
            <div style={{flex:1,minWidth:34,height:6,background:'rgba(255,255,255,.7)',borderRadius:99,overflow:'hidden'}}>
              <div style={{width:Math.min(100,pct)+'%',height:'100%',background:over?RED:r.bar,borderRadius:99}}></div>
            </div>
            <span style={{fontSize:10.5,fontWeight:800,color:over?RED:r.color,width:30,textAlign:'right',flex:'none'}}>{Math.round(pct)}%</span>
          </div>
        );
      })}
    </div>
  );
}

        <span style={{fontSize:22,fontWeight:700,color:over?RED:primary}}>{used.toLocaleString()}</span>
        <span style={{fontSize:12.5,color:'#8a93a3'}}>จาก {budget.toLocaleString()} บาท</span>

        <span style={{fontSize:16,fontWeight:700,color:over?RED:primary}}>{pct.toFixed(1)}%</span>
      </div>
      <div style={{display:'flex',height:10,background:'#eef0f3',borderRadius:99,overflow:'hidden',marginBottom:10}}>
        {rows.filter(r=>r.amount>0).map((r,i)=><div key={i} style={{width:Math.min(100,budget>0?r.amount/budget*100:0)+'%',background:r.color}}></div>)}
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:8,fontSize:12.5,color:'#3c4350'}}>

}

/* ── ปุ่ม Snapshot Manual รายแผน — แสดงเฉพาะเดือนที่อยู่ในช่วงกดได้เท่านั้น ── */
function PlanSnapshotButtons({node,fyStartMonth,fy,delayDays,store,onSaveMonth}){
  const [saved,setSaved]=useState({});
  let curAbs=-1;
  for(let a=0;a<12;a++){const md=monthDef(fyStartMonth,fy,a); if(NOW>=md.start&&NOW<=md.end){curAbs=a;break;}}
  const recMonths=[];
  for(let a=0;a<12;a++){ if(curAbs>=0&&a<curAbs-1) continue; const mo=resolveMonth(store,fyStartMonth,fy,a,delayDays,'-'+node.id); if(mo.canRecord) recMonths.push(mo); }
  if(recMonths.length===0) return null;
  const rec=(mo)=>{
    const nextV=(mo.versions.reduce((m,v)=>Math.max(m,v.v),0))+1;
    const vers=[...mo.versions.map(v=>v.status==='ACTIVE'?{...v,status:'SUPERSEDED'}:v),{v:nextV,type:'MANUAL',date:new Date(),by:CURRENT_USER,status:'ACTIVE',remark:''}];
    onSaveMonth(mo.key,vers); setSaved(s=>({...s,[mo.key]:nextV}));
  };
  return (
    <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
      {recMonths.map(mo=>{
        const done=saved[mo.key];
        return <button key={mo.key} onClick={()=>rec(mo)} title={'บันทึก Manual ได้ถึง '+fmtDate(mo.deadline)+' (ก่อน Auto เดือนถัดไป)'} style={{height:32,display:'inline-flex',alignItems:'center',justifyContent:'center',gap:5,borderRadius:8,padding:'0 12px',border:'none',background:done?'#e6f6f2':primarySoft,color:done?'#0e7c6d':primary,fontSize:11.5,fontWeight:700,cursor:'pointer'}}><i className={'bi '+(done?'bi-check-circle-fill':'bi-camera')} style={{fontSize:12}}></i>{done?('บันทึกแล้ว '+mo.monthName+' v'+done):('Snapshot '+mo.monthName)}</button>;
      })}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════════
   SNAPSHOT — Business Logic (Automatic + Manual)
   • คำนวณไตรมาสตามปีงบประมาณ (fiscalStartMonth) — ไม่ผูกกับปีปฏิทินตายตัว
   • Automatic Snapshot: วันครบกำหนด = วันสิ้นไตรมาส + delayDays
   • Manual Snapshot: ผู้มีสิทธิ์กดเอง, มี Priority สูงกว่า Auto → เขียนทับได้ (versioning)
   • Dashboard เลือกแสดง: Manual ล่าสุด → Auto → UPCOMING/PENDING
   หมายเหตุ: หน้านี้เป็น prototype — การควบคุมสิทธิ์/idempotency/transaction
   ต้องบังคับจากฝั่ง Backend จริง (ดู DEV note ในแต่ละโมดัล)
   ════════════════════════════════════════════════════════════════════════ */
const TH_MONTHS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MONTHS_FULL=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

const fmtDate=(d)=>d.getDate()+' '+TH_MONTHS[d.getMonth()]+' '+(d.getFullYear()+543);
const fmtDateTime=(d)=>fmtDate(d)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
const quarterDef=(fyStartMonth,fy,i)=>{
  const sm=(fyStartMonth-1+i*3), sy=fy+Math.floor(sm/12);
  const start=new Date(sy,sm%12,1), end=new Date(sy,sm%12+3,0);
  return {start,end};
};
const qMonthsLabel=(fyStartMonth,i)=>{ const s=(fyStartMonth-1+i*3)%12, e=(fyStartMonth-1+i*3+2)%12; return TH_MONTHS[s]+'–'+TH_MONTHS[e]; };

};

function resolveQuarter(store,fyStartMonth,fy,i,delayDays){
  const q=quarterDef(fyStartMonth,fy,i);
  const autoDate=new Date(q.end); autoDate.setDate(autoDate.getDate()+delayDays);
  const key=fy+'-'+(i+1);
  const versions=store[key]||[];
  const active=versions.filter(v=>v.status==='ACTIVE').slice(-1)[0]||null;
  let state;
  if(active) state=active.type==='MANUAL'?'MANUAL_SNAPSHOT':'AUTO_SNAPSHOT';
  else if(NOW<q.end) state='UPCOMING';
  else state='PENDING';
  return {i,qNum:i+1,start:q.start,end:q.end,autoDate,versions,active,state,key};
}

// รายเดือน: หน้าต่างบันทึก Manual ของเดือน = เปิดตั้งแต่เริ่มเดือน จนถึง "ก่อน Auto ของเดือนถัดไป" (= autoDate ของเดือนถัดไป) หากเลยแล้วบันทึกไม่ได้ (CLOSED)
function monthDef(fyStartMonth,fy,absIdx){
  const sm=(fyStartMonth-1+absIdx), sy=fy+Math.floor(sm/12), m0=sm%12;
  return {start:new Date(sy,m0,1),end:new Date(sy,m0+1,0),m0,year:sy};
}
function resolveMonth(store,fyStartMonth,fy,absIdx,delayDays,keySuffix){
  const md=monthDef(fyStartMonth,fy,absIdx);
  const autoDate=new Date(md.end); autoDate.setDate(autoDate.getDate()+delayDays);
  const next=monthDef(fyStartMonth,fy,absIdx+1);
  const deadline=new Date(next.end); deadline.setDate(deadline.getDate()+delayDays); // = Auto ของเดือนถัดไป
  const key=fy+'-M'+absIdx+(keySuffix||'');
  const versions=store[key]||[];
  const active=versions.filter(v=>v.status==='ACTIVE').slice(-1)[0]||null;
  const started=md.start<=NOW, closed=NOW>=deadline, canRecord=started&&!closed;
  let state;
  if(active) state=active.type==='MANUAL'?'MANUAL_SNAPSHOT':'AUTO_SNAPSHOT';
  else if(!started) state='UPCOMING';
  else if(closed) state='CLOSED';
  else state='PENDING';
  return {absIdx,md,autoDate,deadline,key,versions,active,state,started,closed,canRecord,monthName:TH_MONTHS_FULL[md.m0],year:md.year};
}

function SnapshotCreateModal({fyStartMonth,fy,delayDays,store,initQ,onClose,onSave}){
  const opts=[0,1,2,3].map(i=>({v:i,started:quarterDef(fyStartMonth,fy,i).start<=NOW}));
  const lastStarted=opts.filter(o=>o.started).slice(-1)[0];
  const first=(initQ!=null&&opts[initQ].started)?initQ:(lastStarted?lastStarted.v:0);
  const [qi,setQi]=useState(first);
  const [remark,setRemark]=useState('');
  const qq=resolveQuarter(store,fyStartMonth,fy,qi,delayDays);
  const canSave=qq.start<=NOW, overwrite=qq.active;
  const inp={width:'100%',border:'1px solid #e3e7ec',borderRadius:9,padding:'10px 12px',fontSize:13.5,outline:'none',color:'#1f2733',fontFamily:'inherit',boxSizing:'border-box',resize:'vertical'};
  const save=()=>{
    if(!canSave) return;
    const nextV=(qq.versions.reduce((m,v)=>Math.max(m,v.v),0))+1;
    const versions=[...qq.versions.map(v=>v.status==='ACTIVE'?{...v,status:'SUPERSEDED'}:v),

    onSave(qq.key,versions);
  };

  const meta=(k,val)=>(<div style={{display:'flex',justifyContent:'space-between',gap:10,fontSize:12.5,padding:'6px 0'}}><span style={{color:'#8a93a3'}}>{k}</span><span style={{fontWeight:600,color:'#1a2332',textAlign:'right'}}>{val}</span></div>);

          <span style={{display:'inline-flex',alignItems:'center',gap:6,height:24,padding:'0 10px',borderRadius:8,fontSize:11,fontWeight:700,background:m.bg,color:m.color,border:'1px solid '+m.bd}}><i className={'bi '+m.icon} style={{fontSize:11}}></i>{m.label}</span>

function ReportContent(){
  const [round,setRound]=useState(ROUNDS[0].id);
  const [roundOpen,setRoundOpen]=useState(false);
  const [query,setQuery]=useState('');
  const [pathIds,setPathIds]=useState([]); // drill path: [missionId, goalId, strategyId]
  const [viewStack,setViewStack]=useState([]); // เปิดดู "ข้อมูลและสถานะ" ของแผนรายการเดียว (ซ้อนกันได้เมื่อคลิกแผนลูกจากหน้ารายละเอียด)
  // ── Snapshot state ──
  const [snapCfg,setSnapCfg]=useState({fyStartMonth:1,delayDays:7,autoEnabled:true,periodType:'QUARTERLY'});
  const [snapFY,setSnapFY]=useState(2026);
  const [snapStore,setSnapStore]=useState(SNAP_SEED);
  const [snapCfgOpen,setSnapCfgOpen]=useState(false);
  const [snapCreate,setSnapCreate]=useState(null); // {q} | null
  const [snapHist,setSnapHist]=useState(null); // quarter obj | null

  const missions=DATA_BY_ROUND[round];
  const cmdData=CMD_SUMMARY_BY_ROUND[round];
  const q=query.trim().toLowerCase();

  // resolve current drill chain against the selected round's data (ids are stable across rounds)
  const chain=[];
  let levelNodes=missions;
  for(const id of pathIds){
    const found=levelNodes.find(n=>n.id===id);
    if(!found) break;
    chain.push(found);
    levelNodes=found.children||[];
  }
  const atRoot=chain.length===0;
  const childLabel=LEVEL_CHILD_LABEL[chain.length]||null;
  const stackTop=viewStack.length?viewStack[viewStack.length-1]:null;

  const visible=useMemo(()=>{
    if(!q) return levelNodes;
    return levelNodes.filter(n=>flattenTree([n]).some(x=>x.title.toLowerCase().includes(q)||x.owner.toLowerCase().includes(q)));
  },[levelNodes,q]);

  const goTo=(depth)=>{setPathIds(pathIds.slice(0,depth));setViewStack([]);};

  return (
    <div style={{flex:1,padding:'24px 28px',overflowY:'auto',height:'calc(100vh - 58px)'}}>

      {/* header */}
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:atRoot?20:12,flexWrap:'wrap'}}>
        <i className="bi bi-diagram-3" style={{fontSize:20,color:primary}}></i>
        <span style={{fontWeight:700,fontSize:16}}>แผนธุรกิจทั้งหมดขององค์กร</span>
        <div style={{flex:1}}></div>
        <div style={{display:'flex',alignItems:'center',gap:8,background:'#fff',border:'1px solid #e3e7ec',borderRadius:9,padding:'8px 12px',width:280}}>
          <i className="bi bi-search" style={{fontSize:14,color:'#9aa3af'}}></i>
          <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="ค้นหาแผนธุรกิจหรือผู้รับผิดชอบ" style={{border:'none',outline:'none',fontSize:13,width:'100%',fontFamily:'inherit',color:'#1f2733'}}/>
        </div>
        <div style={{position:'relative'}}>
          <button onClick={()=>setRoundOpen(o=>!o)} style={{display:'flex',alignItems:'center',gap:8,border:'1px solid #e3e7ec',borderRadius:11,padding:'10px 16px',background:'#fff',cursor:'pointer'}}>
            <span style={{fontSize:13,fontWeight:600,color:'#1f2733'}}>{ROUNDS.find(r=>r.id===round).label}</span>
            <i className="bi bi-chevron-down" style={{fontSize:11,color:'#9aa3af'}}></i>
          </button>
          {roundOpen&&(
            <div style={{position:'absolute',right:0,top:58,background:'#fff',border:'1px solid #e3e7ec',borderRadius:11,boxShadow:'0 8px 24px rgba(16,24,40,.12)',zIndex:20,minWidth:240,overflow:'hidden'}}>
              {ROUNDS.map(r=>(
                <div key={r.id} onClick={()=>{setRound(r.id);setRoundOpen(false);setViewStack([]);}} style={{padding:'11px 18px',fontSize:13,cursor:'pointer',fontWeight:r.id===round?700:400,color:r.id===round?primary:'#1f2733',background:r.id===round?primarySoft:'#fff'}}>
                  {r.label}
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* breadcrumb — เส้นทาง drill + รายการที่กำลังเปิดดูข้อมูลและสถานะ */}
      {(!atRoot||viewStack.length>0)&&(
        <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',fontSize:12.5,marginBottom:16}}>
          <span onClick={()=>goTo(0)} style={{color:primary,fontWeight:600,cursor:'pointer'}}>แผนธุรกิจทั้งหมด</span>
          {chain.map((n,i)=>{
            const isLast=i===chain.length-1&&viewStack.length===0;
            return (
              <React.Fragment key={n.id}>
                <i className="bi bi-chevron-right" style={{fontSize:10,color:'#c4ccd4'}}></i>
                <span onClick={()=>!isLast&&goTo(i+1)} style={{color:isLast?'#1a2332':primary,fontWeight:isLast?700:600,cursor:isLast?'default':'pointer'}}>{n.title}</span>
              </React.Fragment>
            );
          })}
          {viewStack.map((n,i)=>{
            const isLast=i===viewStack.length-1;
            return (
              <React.Fragment key={'v'+n.id}>
                <i className="bi bi-chevron-right" style={{fontSize:10,color:'#c4ccd4'}}></i>
                <span onClick={()=>!isLast&&setViewStack(viewStack.slice(0,i+1))} style={{color:isLast?'#1a2332':primary,fontWeight:isLast?700:600,cursor:isLast?'default':'pointer'}}>{n.title}</span>
              </React.Fragment>
            );
          })}
        </div>
      )}

      {stackTop?(
        /* หน้าข้อมูลและสถานะของแผนรายการเดียว */
        <PlanDetail
          node={stackTop}
          level={chain.length+viewStack.length-1}
          onBack={()=>setViewStack(viewStack.slice(0,-1))}
          onOpenChild={(c)=>setViewStack([...viewStack,c])}
          onDrill={()=>{setPathIds([...pathIds,...viewStack.map(n=>n.id)]);setViewStack([]);}}
          snapCfg={snapCfg} snapFY={snapFY} snapStore={snapStore}
          onSaveMonth={(key,versions)=>setSnapStore(s=>({...s,[key]:versions}))}
        />
      ):(
        <React.Fragment>
          {atRoot&&!q&&<SnapshotBar fyStartMonth={snapCfg.fyStartMonth} fy={snapFY} delayDays={snapCfg.delayDays} autoEnabled={snapCfg.autoEnabled} store={snapStore} onFYChange={setSnapFY} onConfig={()=>setSnapCfgOpen(true)} onCreate={(qi)=>setSnapCreate({q:qi})} onHistory={(qq)=>setSnapHist(qq)}/>}
          {/* plan cards — คลิกการ์ดเพื่อดูข้อมูลและสถานะ, ปุ่ม "ดู...รายการ" เพื่อ drill ลงชั้นถัดไป */}
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            {visible.length===0?(
              <div style={{background:'#fff',border:'1px solid #eceef2',borderRadius:14,padding:'40px 20px',textAlign:'center',color:'#b3bac4',fontSize:13}}>ไม่พบแผนธุรกิจที่ตรงกับคำค้นหา</div>
            ):visible.map(n=>(
              <PlanCard key={n.id} node={n} childLabel={childLabel} onOpen={()=>setViewStack([n])} onDrill={()=>setPathIds([...pathIds,n.id])}/>
            ))}
          </div>
          {atRoot&&<CmdSummarySection data={cmdData}/>}
        </React.Fragment>
      )}

      {snapCfgOpen&&<SnapshotConfigModal cfg={snapCfg} onClose={()=>setSnapCfgOpen(false)} onSave={(c)=>{setSnapCfg(c);setSnapCfgOpen(false);}}/>}
      {snapCreate!==null&&<SnapshotCreateModal fyStartMonth={snapCfg.fyStartMonth} fy={snapFY} delayDays={snapCfg.delayDays} store={snapStore} initQ={snapCreate.q} onClose={()=>setSnapCreate(null)} onSave={(key,versions)=>{setSnapStore(s=>({...s,[key]:versions}));setSnapCreate(null);}}/>}
      {snapHist&&<SnapshotHistoryModal q={resolveQuarter(snapStore,snapCfg.fyStartMonth,snapFY,snapHist.i,snapCfg.delayDays)} fyStartMonth={snapCfg.fyStartMonth} fy={snapFY} delayDays={snapCfg.delayDays} store={snapStore} onSaveMonth={(key,versions)=>setSnapStore(s=>({...s,[key]:versions}))} onClose={()=>setSnapHist(null)}/>}
    </div>
  );
}

function App(){
  return (
    <GD5AppShell active="business">
      <LeftNav/>
      <ReportContent/>
    </GD5AppShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

  var out=Babel.transform(shellSrc+'\n'+pageSrc,{presets:[['react',{runtime:'classic'}]]}).code;

</body>
