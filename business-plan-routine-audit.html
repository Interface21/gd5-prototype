/* ยึดข้อมูลตามรอบการวัดเป้า: อนาคต (r2) = VM ยังไม่เริ่มเช็ค; อดีตที่ปิดรอบ (r3/r4) = ทุก VM ทำครบ */
function scaleVMs(plan,round){
  return plan.vms.map(v=>{
    if(round==='r2') return {...v,uses:0};
    if(round==='r3'||round==='r4') return {...v,uses:v.uses+2};
    return v;
  });
}

const AVCOLORS=['#3b82f6','#f59e0b','#8b5cf6','#0e8c7d','#ef4444','#15a08f','#db2777'];
const avColor=(s)=>{let h=0;for(let i=0;i<s.length;i++)h=(h+s.charCodeAt(i)*31)|0;return AVCOLORS[Math.abs(h)%AVCOLORS.length];};

function MissionBadge({missionId,full}){
  const m=MISSION_BY_ID[missionId];
  return (
    <span style={{display:'inline-flex',alignItems:'center',gap:6,height:24,boxSizing:'border-box',background:m.bg,color:m.color,border:'1px solid '+m.bd,borderRadius:8,padding:'0 10px',fontSize:11,fontWeight:700,whiteSpace:'nowrap'}}>
      <i className="bi bi-flag-fill" style={{fontSize:10}}></i>{full?m.title:m.short}
    </span>
  );
}
function ParentPlanBadge({level,title}){
  return (
    <span style={{display:'inline-flex',alignItems:'center',gap:6,maxWidth:'100%',boxSizing:'border-box',background:'#f4f6f8',color:'#5a6473',border:'1px solid #e6e9ee',borderRadius:8,padding:'4px 10px',fontSize:11.5,fontWeight:600}}>
      <i className="bi bi-diagram-3" style={{fontSize:12,color:'#9aa3af',flex:'none'}}></i>
      <span style={{fontWeight:700,color:'#3a4452',flex:'none'}}>{level}</span>
      <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{title}</span>
    </span>
  );
}

function VMRow({g}){
  return (
    <div style={{display:'flex',alignItems:'center',gap:10,border:'1px solid #eceef2',borderRadius:10,padding:'9px 12px',flexWrap:'wrap'}}>
      <div style={{width:32,height:32,borderRadius:'50%',background:avColor(g.title),color:'#fff',fontWeight:700,fontSize:13,display:'flex',alignItems:'center',justifyContent:'center',flex:'none'}}>{g.title.trim().charAt(0)}</div>
      <div style={{flex:1,minWidth:170}}>
        <div style={{fontSize:13,fontWeight:700,color:'#1a2332',lineHeight:1.3,marginBottom:3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{g.title}</div>
        <div style={{display:'flex',alignItems:'center',gap:10,fontSize:11.5,color:'#9aa3af',flexWrap:'wrap'}}>
          <span style={{display:'inline-flex',alignItems:'center',gap:4}}><i className="bi bi-people" style={{fontSize:12}}></i>{g.members} สมาชิก</span>
          <span style={{display:'inline-flex',alignItems:'center',gap:4,color:primary,fontWeight:700}}><i className="bi bi-arrow-repeat" style={{fontSize:13}}></i>เรียกใช้งาน {g.uses} ครั้ง</span>
        </div>
      </div>
      <a href={g.href} style={{flex:'none',display:'inline-flex',alignItems:'center',justifyContent:'center',gap:6,height:32,padding:'0 14px',borderRadius:11,border:'1px solid #e3e7ec',background:'#fff',color:'#3a4452',fontSize:12.5,fontWeight:700}}>
        <i className="bi bi-box-arrow-up-right" style={{fontSize:12}}></i>ดูกลุ่ม
      </a>
    </div>
  );
}

      <button onClick={()=>setOpen(o=>!o)} style={{display:'flex',alignItems:'flex-start',gap:12,width:'100%',textAlign:'left',padding:'16px 18px',border:'none',background:'none',cursor:'pointer'}}>

        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:14.5,fontWeight:700,color:'#1a2332',marginBottom:8}}>{plan.title}</div>
          <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>

          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8,flex:'none',flexWrap:'wrap',justifyContent:'flex-end',maxWidth:260}}>

            <span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:5,height:24,boxSizing:'border-box',fontSize:11,fontWeight:700,color:'#3b6fd4',background:'#eaf1fe',borderRadius:8,padding:'0 10px'}}><i className="bi bi-people-fill" style={{fontSize:11}}></i>{vms.length} กลุ่ม VM</span>
          ):(
            <span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:5,height:24,boxSizing:'border-box',fontSize:11,fontWeight:600,color:'#9aa3af',background:'#f1f3f6',borderRadius:8,padding:'0 10px'}}><i className="bi bi-dash-circle" style={{fontSize:11}}></i>ยังไม่มี VM เรียกใช้</span>
          )}
          <span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',height:24,boxSizing:'border-box',fontSize:11,color:'#9aa3af',fontWeight:600,background:'#f1f3f6',borderRadius:8,padding:'0 10px'}}>{plan.items.length} ข้อ</span>
          <span style={{width:28,height:28,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',background:open?'#cde2df':'#ebebeb'}}>
            <i className={'bi '+(open?'bi-chevron-up':'bi-chevron-down')} style={{fontSize:13,color:open?'#4e9b92':'#2b3440'}}></i>
          </span>
        </div>

      {open&&(
        <div style={{padding:'0 18px 18px'}}>
          <div style={{display:'flex',alignItems:'center',gap:0,borderBottom:'1px solid #f0f2f5',marginBottom:14}}>
            {[['vms','กลุ่ม VM ที่เรียกใช้',vms.length],['items','รายการย่อย',plan.items.length]].map(([k,label,count])=>(

                <span style={{minWidth:18,height:18,borderRadius:99,background:cur===k?primarySoft:'#f4f5f7',color:cur===k?primary:'#9aa3af',fontSize:11,fontWeight:700,display:'inline-flex',alignItems:'center',justifyContent:'center',padding:'0 5px'}}>{count}</span>

          </div>

            vms.length===0?(
              <div style={{fontSize:12.5,color:'#c4ccd4',padding:'4px 2px'}}>ยังไม่มีกลุ่ม VM ที่เรียกใช้แผนประจำนี้</div>
            ):(
              <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {vms.map((g,i)=><VMRow key={i} g={g}/>)}
              </div>
            )
          ) : (
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {plan.items.map((it,idx)=>(
                <div key={idx} style={{display:'flex',alignItems:'center',gap:10,border:'1px solid #eceef2',borderRadius:10,padding:'9px 12px'}}>

                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

  const [round,setRound]=useState(ROUNDS[0].id);
  const [roundOpen,setRoundOpen]=useState(false);
  const [mission,setMission]=useState('all'); // ตัวกรอง Level 1 (พันธกิจ) เท่านั้น
  const [query,setQuery]=useState('');

  const q=query.trim().toLowerCase();
  const filtered=useMemo(()=>ROUTINE_PLANS.filter(p=>{
    if(mission!=='all'&&p.missionId!==mission) return false;
    if(q&&!(p.title.toLowerCase().includes(q)||p.parentTitle.toLowerCase().includes(q))) return false;
    return true;
  }),[mission,q]);

  const totalVMs=filtered.reduce((s,p)=>s+p.vms.length,0);

  return (
    <div style={{flex:1,padding:'24px 28px',overflowY:'auto',height:'calc(100vh - 58px)'}}>
      {/* header */}
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16,flexWrap:'wrap'}}>
        <i className="bi bi-journal-check" style={{fontSize:20,color:primary}}></i>
        <span style={{fontWeight:700,fontSize:16}}>ตรวจสอบแผนประจำ</span>
        <div style={{flex:1}}></div>
        <div style={{display:'flex',alignItems:'center',gap:8,background:'#fff',border:'1px solid #e3e7ec',borderRadius:9,padding:'8px 12px',width:280}}>
          <i className="bi bi-search" style={{fontSize:14,color:'#9aa3af'}}></i>
          <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="ค้นหาแผนประจำหรือแผนธุรกิจต้นสังกัด" style={{border:'none',outline:'none',fontSize:13,width:'100%',fontFamily:'inherit',color:'#1f2733'}}/>
        </div>
        <div style={{position:'relative'}}>
          <button onClick={()=>setRoundOpen(o=>!o)} style={{display:'flex',alignItems:'center',gap:8,border:'1px solid #e3e7ec',borderRadius:11,padding:'10px 16px',background:'#fff',cursor:'pointer'}}>
            <span style={{fontSize:13,fontWeight:600,color:'#1f2733'}}>{ROUNDS.find(r=>r.id===round).label}</span>
            <i className="bi bi-chevron-down" style={{fontSize:11,color:'#9aa3af'}}></i>
          </button>
          {roundOpen&&(
            <div style={{position:'absolute',right:0,top:58,background:'#fff',border:'1px solid #e3e7ec',borderRadius:11,boxShadow:'0 8px 24px rgba(16,24,40,.12)',zIndex:20,minWidth:240,overflow:'hidden'}}>
              {ROUNDS.map(r=>(
                <div key={r.id} onClick={()=>{setRound(r.id);setRoundOpen(false);}} style={{padding:'11px 18px',fontSize:13,cursor:'pointer',fontWeight:r.id===round?700:400,color:r.id===round?primary:'#1f2733',background:r.id===round?primarySoft:'#fff'}}>
                  {r.label}
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* filter bar — Level 1 (พันธกิจ) เท่านั้น */}
      <div style={{background:'#fff',border:'1px solid #eceef2',borderRadius:14,padding:'14px 18px',boxShadow:'0 1px 3px rgba(16,24,40,.04)',marginBottom:16}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:11}}>
          <i className="bi bi-funnel" style={{fontSize:14,color:primary}}></i>
          <span style={{fontSize:12.5,fontWeight:700,color:'#3a4452'}}>กรองตามแผนธุรกิจ (พันธกิจ / Level 1)</span>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {[{id:'all',label:'ทั้งหมด'},...MISSIONS.map(m=>({id:m.id,label:m.title}))].map(opt=>{
            const active=mission===opt.id;
            const m=MISSION_BY_ID[opt.id];
            return (
              <button key={opt.id} onClick={()=>setMission(opt.id)} style={{display:'inline-flex',alignItems:'center',gap:7,height:34,padding:'0 14px',borderRadius:8,border:'1px solid '+(active?(m?m.color:primary):'#e3e7ec'),background:active?(m?m.bg:primarySoft):'#fff',color:active?(m?m.color:primary):'#5a6473',fontSize:12.5,fontWeight:active?700:500,cursor:'pointer'}}>
                {m&&<span style={{width:9,height:9,borderRadius:'50%',background:m.color,flex:'none'}}></span>}
                {opt.label}
              </button>
            );
          })}
        </div>
      </div>

      {/* summary line */}
      <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:14,fontSize:12.5,color:'#8a93a3',flexWrap:'wrap',padding:'0 2px'}}>
        <span><i className="bi bi-journal-check" style={{fontSize:13,color:'#b3bac4',marginRight:5}}></i>แผนประจำ <b style={{color:'#1a2332'}}>{filtered.length}</b> รายการ</span>
        <span><i className="bi bi-people-fill" style={{fontSize:13,color:'#b3bac4',marginRight:5}}></i>เรียกใช้โดย <b style={{color:'#1a2332'}}>{totalVMs}</b> กลุ่ม VM</span>
      </div>

      {/* list */}
      {filtered.length===0?(
        <div style={{background:'#fff',border:'1px solid #eceef2',borderRadius:14,padding:'40px 20px',textAlign:'center',color:'#b3bac4',fontSize:13}}>ไม่พบแผนประจำที่ตรงกับเงื่อนไข</div>
      ):(
        <div style={{display:'flex',flexDirection:'column',gap:12,animation:'fadeIn .15s ease'}}>
          {filtered.map(p=><RoutineCard key={p.id} plan={p} vms={scaleVMs(p,round)}/>)}
        </div>
      )}

      <div style={{display:'flex',alignItems:'flex-start',gap:9,fontSize:12,color:'#9aa3af',padding:'16px 4px 0'}}>
        <i className="bi bi-question-circle" style={{fontSize:15,color:'#b3bac4',flex:'none',marginTop:1}}></i>
        <span>หน้านี้ใช้ตรวจสอบว่าแผนงานประจำแต่ละชุดสังกัดแผนธุรกิจใด และมีกลุ่ม Virtual Meeting ใดเรียกใช้งานอยู่ — ข้อมูลยึดตามรอบการวัดเป้าที่เลือก กรองได้เฉพาะระดับพันธกิจ (Level 1)</span>
      </div>
    </div>
  );
}

function App(){
  return (
    <GD5AppShell active="business">
      <LeftNav/>
      <AuditContent/>
    </GD5AppShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

(async function(){
  var shellSrc='';
  try{ shellSrc=await (await fetch('gd5-app-shell.jsx')).text(); }catch(e){}
  var pageSrc=document.getElementById('jsx-src').textContent;
  var out=Babel.transform(shellSrc+'\n'+pageSrc,{presets:[['react',{runtime:'classic'}]]}).code;
  new Function(out)();
})();
</script>
</body>
</html>
